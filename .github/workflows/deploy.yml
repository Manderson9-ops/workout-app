# main 에 push 하면 테스트 → 빌드 → GitHub Pages 배포 (BLUEPRINT D-010, app-release 스킬)
# 공개 배포 전 사용자 승인은 AGENTS 규칙 13에 따라 push 전에 받는다.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 본판(workout-app)과 미리 보기 판(workout-app-next, D-031)이 같은 파일을 씀: 저장소 이름으로 빌드를 고름
      - if: github.repository != 'Manderson9-ops/workout-app-next'
        run: npx vite build
      - if: github.repository != 'Manderson9-ops/workout-app-next'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: github.repository == 'Manderson9-ops/workout-app-next'
        run: npx vite build --base /workout-app-next/ --outDir dist-next && node tools/next_brand.ts dist-next
      - if: github.repository == 'Manderson9-ops/workout-app-next'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-next
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
